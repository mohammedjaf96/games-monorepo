<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games Monorepo — Web Preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #1b1338, #0a0618 70%);
      color: #eef0ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 420px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 6px; text-align: center; }
    p.sub { color: #9294b8; text-align: center; margin: 0 0 28px; font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 14px; }
    a.card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #0a0618;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    }
    a.card span.arrow { font-size: 20px; }
    .blocko { background: linear-gradient(120deg, #00D9FF, #3D5CFF); }
    .dashy { background: linear-gradient(120deg, #FFD028, #7C3AED); color: #fff; }
    .mergo { background: linear-gradient(120deg, #FFD028, #12D9C0); }
    footer { text-align: center; margin-top: 28px; }
    footer a { color: #9294b8; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>معاينة الألعاب على الويب</h1>
    <p class="sub">اختر لعبة لتجربتها مباشرة من المتصفح</p>
    <div class="cards">
      <a class="card blocko" href="blocko/"><span>Blocko</span><span class="arrow">←</span></a>
      <a class="card dashy" href="dashy/"><span>Dashy</span><span class="arrow">←</span></a>
      <a class="card mergo" href="mergo/"><span>Mergo</span><span class="arrow">←</span></a>
    </div>
    <footer><a href="privacy/">سياسة الخصوصية</a></footer>
  </div>
</body>
</html>
