name: game_core
description: "Shared core for the casual games (ads, economy, store, daily rewards, settings, theme, icons, audio)."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  google_mobile_ads: ^5.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  audioplayers: ^6.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  app_tracking_transparency: ^2.0.6+1
  collection: ^1.18.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
